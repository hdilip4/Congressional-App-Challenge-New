<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ergo Grow</title>
<!-- This links your HTML file to your styles.css file -->
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<!-- SCREEN 1 -->
<div id="screen-1" class="app-screen">
<div class="screen-one-art" aria-hidden="true"></div>
<header class="brand">
<svg class="brand-tree" viewBox="0 0 180 180" aria-hidden="true">

<ellipse cx="69" cy="60" rx="10" ry="5" transform="rotate(-35 69 60)"/>
<ellipse cx="93" cy="32" rx="11" ry="5" transform="rotate(-70 93 32)"/>
<ellipse cx="104" cy="52" rx="11" ry="5" transform="rotate(-42 104 52)"/>
<ellipse cx="117" cy="56" rx="11" ry="5" transform="rotate(-25 117 56)"/>
<ellipse cx="124" cy="78" rx="12" ry="5" transform="rotate(-30 124 78)"/>
<ellipse cx="42" cy="91" rx="11" ry="5" transform="rotate(20 42 91)"/>
<ellipse cx="59" cy="104" rx="11" ry="5" transform="rotate(-28 59 104)"/>
<ellipse cx="132" cy="108" rx="12" ry="5" transform="rotate(-15 132 108)"/>
<ellipse cx="112" cy="119" rx="11" ry="5" transform="rotate(20 112 119)"/>

</g>
<path class="tree-ground" d="M17 165c37-5 82-3 145 0"/>
</svg>
<div class="brand-copy">
<h1>Ergo <span>Grow</span></h1>
<p>Your very own desk buddy</p>
</div>
</header>
<main class="signup-card">
<h2>Make an account</h2>
<form class="signup-form" onsubmit="event.preventDefault();">
<label class="visually-hidden" for="signup-username">Username</label>
<input id="signup-username" name="username" type="text" placeholder="Username" autocomplete="username">
<label class="visually-hidden" for="signup-password">Password</label>
<input id="signup-password" name="password" type="password" placeholder="Password" autocomplete="new-password">
<button class="create-account-button" type="button" onclick="handleSignUp()">Create account</button>
<p class="account-prompt">
Have an account?
<button type="button" onclick="goToScreen('screen2')">Log in</button>
</p>
</form>
</main>
</div>

<!-- SCREEN 2 -->
<div id="screen2" class="app-screen hidden">
<header class="login-brand">
<h1>Ergo <span>Grow</span></h1>
</header>
<main class="login-card">
<h2>Log in</h2>
<form class="login-form" onsubmit="event.preventDefault();">
<label class="visually-hidden" for="login-username">Username</label>
<input id="login-username" name="username" type="text" placeholder="Username" autocomplete="username">
<label class="visually-hidden" for="login-password">Password</label>
<input id="login-password" name="password" type="password" placeholder="Password" autocomplete="current-password">
<button type="button" onclick="handleLogin()">Log in</button>
</form>
</main>
</div>

<!-- SCREEN 3 -->
<div id="screen-3" class="app-screen hidden">
<main class="wellness-screen">
<header class="wellness-intro">
<p>Tell us what you experience. We'll send you gentle, timed reminders to help your body feel its best.</p>
</header>
<section class="wellness-content" aria-label="Choose your wellness focus areas">
<div class="wellness-options">
<label class="wellness-option">
<span>Eye Strain</span>
<input type="checkbox" name="wellness-focus" value="Eye Strain" aria-label="Eye Strain">
</label>
<label class="wellness-option">
<span>Neck Tension</span>
<input type="checkbox" name="wellness-focus" value="Neck Tension" aria-label="Neck Tension">
</label>
<label class="wellness-option">
<span>Back &amp; Posture</span>
<input type="checkbox" name="wellness-focus" value="Back & Posture" aria-label="Back &amp; Posture">
</label>
<label class="wellness-option">
<span>Wrist &amp; <br>Hand Tension</span>
<input type="checkbox" name="wellness-focus" value="Wrist & Hand Tension" aria-label="Wrist and Hand Tension">
</label>
<label class="wellness-option">
<span>Hip tightness</span>
<input type="checkbox" name="wellness-focus" value="Hip tightness" aria-label="Hip tightness">
</label>
<label class="wellness-option">
<span>Tension Headaches</span>
<input type="checkbox" name="wellness-focus" value="Tension Headaches" aria-label="Tension Headaches">
</label>
</div>
<p id="wellness-guidance" class="wellness-guidance" aria-live="polite">Select at least one to continue</p>
<button class="wellness-start-button" type="button" onclick="startWellnessPlan()">Start My Wellness Plan</button>
</section>
</main>
</div>

<!-- CUSTOM AESTHETIC MODAL POPUP -->
<div id="custom-modal" class="custom-modal hidden">
  <div class="modal-content">
    <p id="modal-message">Message goes here</p>
    <button type="button" onclick="closeModal()">Got it</button>
  </div>
</div>

<!-- JavaScript engine -->
<script>
const { createClient } = require('@supabase/supabase-js');

// Direct Supabase Connection
const supabaseUrl = 'https://ktsljnfeazyjxadijaxs.supabase.co';
const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt0c2xqbmZlYXp5anhhZGlqYXhzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE2Mzk4NDIsImV4cCI6MjEwNzIxNTg0Mn0.llkQzNdnlL1seCsbytjV8Pxl1-5oCBZNpMQni3hOGlE'; // Replace with your real Supabase anon key

const supabase = createClient(supabaseUrl, supabaseKey);

function showModal(message) {
  document.getElementById('modal-message').textContent = message;
  document.getElementById('custom-modal').classList.remove('hidden');
}

function closeModal() {
  document.getElementById('custom-modal').classList.add('hidden');
}

async function handleSignUp() {
  const username = document.getElementById('signup-username').value.trim();
  const password = document.getElementById('signup-password').value;

  if (!username) {
    showModal('Please enter a username to get started.');
    return;
  }

  if (password.length < 6) {
    showModal('Your password is a bit too short. Make sure it is at least 6 characters long.');
    return;
  }

  const email = username.toLowerCase() + '@ergogrow.com';

  // Try signing up first
  let { data, error } = await supabase.auth.signUp({
    email: email,
    password: password,
  });

  // If sign up fails for any reason (rate limit, existing user, etc.), automatically attempt login!
  if (error) {
    console.log('Sign-up failed, attempting auto-login fallback...');
    const loginResult = await supabase.auth.signInWithPassword({
      email: email,
      password: password,
    });
    error = loginResult.error;
    data = loginResult.data;
  }

  if (error) {
    showModal('Supabase Error: ' + error.message); // This will show the exact reason on your screen
    console.error('Auth error:', error.message);
  } else {
    goToScreen('screen-3');
  }
}

async function handleLogin() {
  const username = document.getElementById('login-username').value.trim();
  const password = document.getElementById('login-password').value;

  if (!username) {
    showModal('Please enter your username.');
    return;
  }

  const email = username.toLowerCase() + '@ergogrow.com';

  const { data, error } = await supabase.auth.signInWithPassword({
    email: email,
    password: password,
  });

  if (error) {
    let friendlyMessage = 'Could not log in. Please check your username and password.';
    if (error.message.includes('Invalid login credentials')) {
      friendlyMessage = 'Hmm, that username or password doesn’t quite match. Give it another try!';
    }
    showModal(friendlyMessage);
  } else {
    goToScreen('screen-3');
  }
}

function goToScreen(screenId) {
  document.querySelectorAll('.app-screen').forEach(screen => {
    screen.classList.add('hidden');
  });
  document.getElementById(screenId).classList.remove('hidden');
}

async function startWellnessPlan() {
  const selectedFocusAreas = document.querySelectorAll('input[name="wellness-focus"]:checked');
  const guidance = document.getElementById('wellness-guidance');
  
  if (selectedFocusAreas.length === 0) {
    guidance.textContent = 'Select at least one to continue';
    document.querySelector('input[name="wellness-focus"]').focus();
    return;
  }

  const symptomsArray = Array.from(selectedFocusAreas).map(input => input.value);

  const { data: { user }, error: userError } = await supabase.auth.getUser();

  if (userError || !user) {
    showModal('Please make an account or log in first.');
    return;
  }

  const { error } = await supabase
    .from('user_symptoms')
    .upsert({ 
      user_id: user.id, 
      symptoms: symptomsArray,
      updated_at: new Date()
    }, { onConflict: 'user_id' });

  if (error) {
    showModal('Could not save your preferences. Please try again.');
    console.error('Supabase error:', error.message);
  } else {
    guidance.textContent = 'Your wellness plan is ready to start.';
    showModal('Success! Your notification preferences have been saved.');
  }
}
</script>
</body>
</html>
